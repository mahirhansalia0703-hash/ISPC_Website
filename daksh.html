<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISPC_groupname_2025</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel for single-file execution -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#0f172a',
                accent: '#38bdf8',
                secondary: '#818cf8'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #e2e8f0;
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1e293b; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>

    <!-- MAIN SCRIPT -->
    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
      import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
      import { 
        Menu, X, Hexagon, ArrowRight, Mail, Play, 
        Search, Lightbulb, PenTool, CheckCircle2, 
        AlertTriangle, Check, Atom, FlaskConical, 
        Calculator, Book, Globe, User 
      } from 'https://esm.sh/lucide-react@0.292.0';

      // --- DATA & CONSTANTS ---

      const TEAM_MEMBERS = [
        {
          id: 1,
          name: "Rushabh Siddhpura",
          role: "Team Member",
          gradeDivision: "Grade 11 - Div A",
          bio: "Contributed to chemical formulation and material testing.",
          imageUrl: "./rushabh.jpeg"
        },
        {
          id: 2,
          name: "Daksh Gandhi",
          role: "Team Member",
          gradeDivision: "Grade 11 - Div A",
          bio: "Focused on experimental design and data analysis.",
          imageUrl: "./daksh.jpeg"
        },
        {
          id: 3,
          name: "Smit Parekh",
          role: "Team Member",
          gradeDivision: "Grade 11 - Div A",
          bio: "Researched environmental impact and biodegradability.",
          imageUrl: "smit.jpeg"
        },
        {
          id: 4,
          name: "Mahir Hansaliya",
          role: "Team Member",
          gradeDivision: "Grade 11 - Div A",
          bio: "Worked on prototyping and physical property testing.",
          imageUrl: "mahir.jpeg"
        },
        {
          id: 5,
          name: "Sarvam Ghetia",
          role: "Team Member",
          gradeDivision: "Grade 11 - Div A",
          bio: "Managed documentation and project presentation.",
          imageUrl: "sarvam.jpeg"
        }
      ];

      const SCIENCE_TOPICS = [
        {
          id: 'physics',
          title: 'Physics',
          description: 'Mechanical properties: Stress, Strain, and Elasticity.',
          fullExplanation: `1. Stress and Strain\n\nThe strength of the bioplastic is tested by applying loads and observing deformation. This demonstrates the relationship between force, area, and elongation.\n\n2. Elasticity and Flexibility\n\nThe effect of glycerin concentration on elasticity is studied by bending and stretching the material, linking molecular motion to macroscopic properties.`,
          iconName: 'Atom'
        },
        {
          id: 'chemistry',
          title: 'Chemistry',
          description: 'Polymers, Gelatinisation, and organic breakdown.',
          fullExplanation: `1. Starch Extraction and Composition\n\nBanana peels contain starch composed of amylose and amylopectin. These polysaccharides act as natural polymers.\n\n2. Gelatinisation Process\n\nWhen starch is heated with water, the granules swell and break, releasing polymer chains that form a continuous matrix. This is the fundamental chemical process that enables plastic formation.\n\n3. Biodegradability\n\nSince all components are organic, the material breaks down naturally through microbial action, unlike synthetic plastics.`,
          iconName: 'FlaskConical'
        },
        {
          id: 'maths',
          title: 'Maths',
          description: 'Statistical analysis of durability and degradation.',
          fullExplanation: 'Mathematical analysis of experimental data including tensile strength calculations and degradation rates over time.',
          iconName: 'Calculator'
        }
      ];

      const REFERENCES = [
        { id: 1, title: "Reference details to be added", author: "Author", type: "Book" },
        { id: 2, title: "Reference details to be added", author: "Author", type: "Website", link: "#" },
        { id: 3, title: "Mentor Name", author: "Mentor", type: "Mentor" }
      ];

      // --- COMPONENTS ---

      const Navbar = ({ currentView, onNavigate }) => {
        const [isOpen, setIsOpen] = useState(false);
        const navItems = [
          { id: 'home', label: 'Home' },
          { id: 'about', label: 'About Us' },
          { id: 'idea', label: 'The Idea' },
          { id: 'product', label: 'Product' },
          { id: 'science', label: 'Science' },
          { id: 'bibliography', label: 'Ackn.' },
        ];

        const handleNav = (view) => {
          onNavigate(view);
          setIsOpen(false);
        };

        return (
          <nav className="fixed top-0 w-full z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-700">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                <div className="flex items-center cursor-pointer" onClick={() => handleNav('home')}>
                  <Hexagon className="h-8 w-8 text-cyan-400" />
                  <span className="ml-2 text-xl font-bold text-white tracking-wider">ISPC</span>
                </div>
                <div className="hidden md:block">
                  <div className="ml-10 flex items-baseline space-x-4">
                    {navItems.map((item) => (
                      <button
                        key={item.id}
                        onClick={() => handleNav(item.id)}
                        className={`px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200 ${
                          currentView === item.id
                            ? 'bg-cyan-500/10 text-cyan-400'
                            : 'text-gray-300 hover:text-white hover:bg-slate-700'
                        }`}
                      >
                        {item.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="-mr-2 flex md:hidden">
                  <button
                    onClick={() => setIsOpen(!isOpen)}
                    className="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-slate-700 focus:outline-none"
                  >
                    {isOpen ? <X className="h-6 w-6" /> : <Menu className="h-6 w-6" />}
                  </button>
                </div>
              </div>
            </div>
            {isOpen && (
              <div className="md:hidden bg-slate-800 border-b border-slate-700">
                <div className="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                  {navItems.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => handleNav(item.id)}
                      className={`block w-full text-left px-3 py-2 rounded-md text-base font-medium ${
                        currentView === item.id
                          ? 'bg-cyan-500/20 text-cyan-400'
                          : 'text-gray-300 hover:text-white hover:bg-slate-700'
                      }`}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </nav>
        );
      };

      const Home = ({ onStart }) => (
        <div className="relative min-h-screen flex flex-col justify-center items-center overflow-hidden">
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full h-full z-0 pointer-events-none opacity-20">
            <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl animate-pulse"></div>
            <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl animate-pulse" style={{ animationDelay: '2s' }}></div>
          </div>
          <div className="relative z-10 max-w-4xl mx-auto px-4 text-center">
            <h1 className="text-5xl md:text-7xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500 mb-6">
              Green Polymer Initiative
            </h1>
            <p className="text-xl md:text-2xl text-slate-300 mb-8 font-light">
              Bioplastic from Banana Peels
            </p>
            <div className="bg-slate-800/50 backdrop-blur-sm p-8 rounded-2xl border border-slate-700 shadow-2xl mb-10">
              <h2 className="text-2xl font-semibold text-white mb-4">AIM</h2>
              <p className="text-slate-300 leading-relaxed">
                The aim of this project is to develop a low-cost, biodegradable plastic material using banana peel waste as the primary raw material and to study its physical and chemical properties for potential use in everyday products such as handbags and packaging.
              </p>
            </div>
            <button
              onClick={onStart}
              className="group inline-flex items-center px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-full transition-all duration-300 transform hover:scale-105"
            >
              Explore Our Journey
              <ArrowRight className="ml-2 h-5 w-5 group-hover:translate-x-1 transition-transform" />
            </button>
          </div>
        </div>
      );

      const AboutUs = () => (
        <div className="min-h-screen pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
          <div className="text-center mb-16">
            <h2 className="text-4xl font-bold text-white mb-4">About Us</h2>
            <div className="w-24 h-1 bg-cyan-500 mx-auto rounded-full"></div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-8 mb-20">
            {TEAM_MEMBERS.map((member) => (
              <div key={member.id} className="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 hover:border-cyan-500/50 transition-colors duration-300 group">
                <div className="relative h-64 overflow-hidden">
                  <img src={member.imageUrl} alt={member.name} className="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500" />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent opacity-60"></div>
                  <div className="absolute bottom-0 left-0 p-4">
                    <h3 className="text-lg font-bold text-white leading-tight">{member.name}</h3>
                    <p className="text-cyan-400 text-xs font-medium">{member.role}</p>
                  </div>
                </div>
                <div className="p-4">
                  <p className="text-xs text-slate-400 mb-2 uppercase tracking-wide border-b border-slate-700 pb-2">{member.gradeDivision}</p>
                  <p className="text-slate-300 text-xs leading-relaxed">{member.bio}</p>
                </div>
              </div>
            ))}
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 mb-20">
            <div className="space-y-4">
              <h3 className="text-2xl font-bold text-white flex items-center">
                <span className="w-2 h-8 bg-purple-500 rounded-full mr-3"></span>
                Our Team
              </h3>
              <div className="aspect-video bg-slate-800 rounded-xl overflow-hidden border border-slate-700 relative group">
                <img src="./ourteam.jpeg" alt="Group Team" className="w-full h-full object-cover" />
                <div className="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity">
                  <span className="text-white font-bold">Team 2024</span>
                </div>
              </div>
              <p className="text-slate-400 italic">"Coming together is a beginning, staying together is progress, and working together is success."</p>
            </div>
            <div className="space-y-4">
              <h3 className="text-2xl font-bold text-white flex items-center">
                <span className="w-2 h-8 bg-cyan-500 rounded-full mr-3"></span>
                Our Journey
              </h3>
              <div className="aspect-video bg-black rounded-xl overflow-hidden border border-slate-700 relative">
                <video
                  src="./WhatsApp Video 2025-12-26 at 20.27.38.mp4"
                  poster="./journey-poster.jpg"
                  controls
                  className="w-full h-full object-cover"
                >
                  Your browser does not support the video tag. <a href="./journey.mp4">Download the video</a>.
                </video>
              </div>
              <p className="text-slate-400">Watch how we went from a simple sketch to a fully functional prototype in 12 weeks.</p>
            </div>
          </div>
          <div className="bg-gradient-to-r from-slate-800 to-slate-800/50 p-8 rounded-2xl border border-slate-700">
            <h3 className="text-2xl font-bold text-white mb-6">Get in Touch</h3>
            <div className="grid grid-cols-1 gap-6">
              <div className="flex items-start space-x-4">
                <div className="p-3 bg-slate-700 rounded-lg"><Mail className="text-purple-400 h-6 w-6" /></div>
                <div>
                  <h4 className="text-white font-medium">Email Us</h4>
                  <p className="text-slate-400 text-sm mt-1">team@ispc-project.edu<br />contact@school.edu</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );

      const ProductIdea = () => (
        <div className="min-h-screen pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto">
          <div className="text-center mb-16">
            <h2 className="text-4xl font-bold text-white mb-4">The Idea</h2>
            <p className="text-slate-400 max-w-2xl mx-auto">From identifying a critical gap to engineering a novel solution.</p>
          </div>
          <div className="grid md:grid-cols-2 gap-8 mb-16">
            <div className="bg-red-500/10 border border-red-500/20 p-8 rounded-2xl">
              <div className="flex items-center mb-4">
                <div className="bg-red-500/20 p-3 rounded-full mr-4"><Search className="text-red-400 h-6 w-6" /></div>
                <h3 className="text-2xl font-bold text-white">The Problem</h3>
              </div>
              <p className="text-slate-300 leading-relaxed">
                Non-biodegradable plastics cause severe environmental pollution and persist in nature for hundreds of years. At the same time, large amounts of kitchen waste such as banana peels are discarded daily despite being rich in useful starch. The lack of low-cost, eco-friendly alternatives to plastic worsens both waste management and pollution problems.
              </p>
            </div>
            <div className="bg-green-500/10 border border-green-500/20 p-8 rounded-2xl">
              <div className="flex items-center mb-4">
                <div className="bg-green-500/20 p-3 rounded-full mr-4"><Lightbulb className="text-green-400 h-6 w-6" /></div>
                <h3 className="text-2xl font-bold text-white">The Solution</h3>
              </div>
              <p className="text-slate-300 leading-relaxed">
                This project addresses these issues by converting banana peel waste into biodegradable bioplastic.
              </p>
            </div>
          </div>
          <div className="space-y-8">
            <div className="bg-slate-800 border border-slate-700 p-8 rounded-2xl relative overflow-hidden">
              <div className="absolute top-0 right-0 p-4 opacity-5"><Search className="w-32 h-32 text-white" /></div>
              <h3 className="text-2xl font-bold text-white mb-4">Research Conducted</h3>
              <ul className="space-y-3 text-slate-300">
                <li className="flex items-start">
                  <CheckCircle2 className="h-5 w-5 text-cyan-500 mr-2 mt-0.5 flex-shrink-0" />
                  <div>
                    <a href="https://www.mdpi.com/2073-4395/13/10/2497" target="_blank" rel="noopener noreferrer" className="text-cyan-400 hover:underline">https://www.mdpi.com/2073-4395/13/10/2497</a>
                    <p className="text-slate-400 text-xs mt-1">Study on agricultural waste valorization and bioplastic applications.</p>
                  </div>
                </li>
                <li className="flex items-start">
                  <CheckCircle2 className="h-5 w-5 text-cyan-500 mr-2 mt-0.5 flex-shrink-0" />
                  <div>
                    <a href="https://pubmed.ncbi.nlm.nih.gov/39299129/?utm_source=chatgpt.com" target="_blank" rel="noopener noreferrer" className="text-cyan-400 hover:underline">https://pubmed.ncbi.nlm.nih.gov/39299129/</a>
                    <p className="text-slate-400 text-xs mt-1">Relevant PubMed article (opened via PubMed).</p>
                  </div>
                </li>
                <li className="flex items-start">
                  <CheckCircle2 className="h-5 w-5 text-cyan-500 mr-2 mt-0.5 flex-shrink-0" />
                  <div>
                    <a href="https://pubmed.ncbi.nlm.nih.gov/40673122/?utm_source=chatgpt.com" target="_blank" rel="noopener noreferrer" className="text-cyan-400 hover:underline">https://pubmed.ncbi.nlm.nih.gov/40673122/</a>
                    <p className="text-slate-400 text-xs mt-1">Relevant PubMed article (opened via PubMed).</p>
                  </div>
                </li>
              </ul>
            </div>
            <div className="bg-slate-800 border border-slate-700 p-8 rounded-2xl relative overflow-hidden">
              <div className="absolute top-0 right-0 p-4 opacity-5"><PenTool className="w-32 h-32 text-white" /></div>
              <h3 className="text-2xl font-bold text-white mb-4">Methodology</h3>
              <div className="space-y-6">
                <p className="text-slate-300">The process can be divided into four major stages:</p>
                <ol className="list-decimal list-inside space-y-2 text-slate-300 text-sm">
                  <li><span className="font-semibold">Preparation of banana peel starch</span> — collection, washing, drying, grinding and extracting starch from banana peels.</li>
                  <li><span className="font-semibold">Formulation of the bioplastic solution</span> — mixing extracted starch with plasticizers and additives to obtain a homogeneous solution.</li>
                  <li><span className="font-semibold">Casting and shaping of the film</span> — pouring the solution into molds or onto flat trays and shaping as required.</li>
                  <li><span className="font-semibold">Drying and finishing of the bioplastic bag</span> — controlled drying, trimming, and any post-processing to improve mechanical properties and appearance.</li>
                </ol>
              </div>
            </div>
          </div>
        </div>
      );

      const ProductShowcase = () => {
        const videoSrc = `${window.location.origin}/demo.mp4`;
        const posterSrc = `${window.location.origin}/demo-poster.jpg`;

        return (
          <div className="min-h-screen pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto">
            <div className="text-center mb-12">
              <h2 className="text-4xl font-bold text-white mb-4">The Product</h2>
              <p className="text-slate-400">Banana Peel Bioplastic</p>
            </div>
            <div className="grid lg:grid-cols-2 gap-12 mb-16 items-center">
              <div className="bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-2xl">
                <img src="./product.jpeg" alt="Bioplastic Product" className="w-full h-auto object-cover" />
              </div>
              <div className="space-y-8">
                <div className="bg-slate-800/50 p-6 rounded-xl border border-slate-700">
                  <h4 className="text-xl font-semibold text-cyan-400 mb-3">Key Features</h4>
                  <ul className="space-y-2 text-slate-300">
                    <li className="flex items-center"><Check className="h-5 w-5 text-green-500 mr-2" /> Biodegradable & Compostable</li>
                    <li className="flex items-center"><Check className="h-5 w-5 text-green-500 mr-2" /> Cost-Effective Production</li>
                    <li className="flex items-center"><Check className="h-5 w-5 text-green-500 mr-2" /> Reduces Organic Waste</li>
                    <li className="flex items-center"><Check className="h-5 w-5 text-green-500 mr-2" /> Non-Toxic Material</li>
                  </ul>
                </div>
              </div>
            </div>

            <div className="mb-16">
              <h3 className="text-2xl font-bold text-white mb-6 border-l-4 border-purple-500 pl-4">Demo Video</h3>
              <div className="w-full aspect-video bg-black rounded-2xl overflow-hidden border border-slate-700 relative flex items-center justify-center">
                <video
                  src={videoSrc}
                  poster={posterSrc}
                  controls
                  preload="metadata"
                  className="w-full h-full object-cover"
                >
                  Your browser does not support the video tag. <a href={videoSrc}>Download the video</a>.
                </video>
              </div>
            </div>

            <div className="bg-yellow-500/10 border border-yellow-500/20 rounded-2xl p-8">
              <div className="flex items-center mb-6">
                <AlertTriangle className="h-8 w-8 text-yellow-500 mr-4" />
                <h3 className="text-2xl font-bold text-white">Limitations</h3>
              </div>
              <div className="grid md:grid-cols-2 gap-6">
                <div>
                  <h4 className="text-yellow-200 font-semibold mb-2">Mechanical Strength</h4>
                  <p className="text-slate-300 text-sm">Currently has lower tensile strength compared to synthetic plastics like PE or PP, limiting heavy-load applications.</p>
                </div>
                <div>
                  <h4 className="text-yellow-200 font-semibold mb-2">Water Sensitivity</h4>
                  <p className="text-slate-300 text-sm">Being starch-based, the material can absorb moisture over time, which affects long-term durability in wet conditions.</p>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const ScienceIntegration = () => {
        const [selectedTopic, setSelectedTopic] = useState(null);
        const getIcon = (name) => {
          switch(name) {
            case 'Atom': return <Atom className="w-8 h-8" />;
            case 'FlaskConical': return <FlaskConical className="w-8 h-8" />;
            case 'Calculator': return <Calculator className="w-8 h-8" />;
            default: return <Atom className="w-8 h-8" />;
          }
        };

        return (
          <div className="min-h-screen pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
            <div className="text-center mb-16">
              <h2 className="text-4xl font-bold text-white mb-4">Science Integration</h2>
              <p className="text-slate-400">The technical principles powering our innovation.</p>
            </div>
            <div className="grid md:grid-cols-3 gap-8">
              {SCIENCE_TOPICS.map((topic) => (
                <div key={topic.id} onClick={() => setSelectedTopic(topic)} className="bg-slate-800 p-8 rounded-2xl border border-slate-700 hover:border-cyan-500 hover:bg-slate-700/50 transition-all cursor-pointer group">
                  <div className="bg-slate-900 w-16 h-16 rounded-full flex items-center justify-center text-cyan-400 mb-6 group-hover:scale-110 transition-transform">{getIcon(topic.iconName)}</div>
                  <h3 className="text-2xl font-bold text-white mb-3">{topic.title}</h3>
                  <p className="text-slate-400 mb-6">{topic.description}</p>
                  <div className="flex items-center text-cyan-400 font-medium group-hover:text-cyan-300">Read Technical Details <ArrowRight className="ml-2 w-4 h-4" /></div>
                </div>
              ))}
            </div>
            {selectedTopic && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in duration-200">
                <div className="bg-slate-900 max-w-2xl w-full rounded-2xl border border-slate-700 shadow-2xl overflow-hidden relative">
                  <button onClick={() => setSelectedTopic(null)} className="absolute top-4 right-4 p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition-colors"><X className="w-6 h-6" /></button>
                  <div className="p-8">
                    <div className="flex items-center mb-6">
                      <div className="bg-cyan-500/10 p-3 rounded-lg text-cyan-400 mr-4">{getIcon(selectedTopic.iconName)}</div>
                      <h3 className="text-3xl font-bold text-white">{selectedTopic.title}</h3>
                    </div>
                    <div className="prose prose-invert max-w-none">
                      <p className="text-lg text-slate-300 leading-relaxed whitespace-pre-wrap">{selectedTopic.fullExplanation}</p>
                      <div className="mt-8 p-4 bg-slate-800 rounded-lg border-l-4 border-cyan-500">
                        <h4 className="text-white font-semibold mb-2">Application in Project</h4>
                        <p className="text-sm text-slate-400">This scientific principle was crucial in the design and testing phase of our bioplastic material.</p>
                      </div>
                    </div>
                    <div className="mt-8 flex justify-end">
                      <button onClick={() => setSelectedTopic(null)} className="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition-colors border border-slate-600">Close</button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const Bibliography = () => (
        <div className="min-h-screen pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">
          <div className="text-center mb-16">
            <h2 className="text-4xl font-bold text-white mb-4">Acknowledgments & References</h2>
            <p className="text-slate-400">Recognizing those who helped us along the way.</p>
          </div>
          <div className="grid gap-6">
            {REFERENCES.map((ref) => (
              <div key={ref.id} className="bg-slate-800/50 backdrop-blur border border-slate-700 p-6 rounded-xl flex items-start hover:bg-slate-800 transition-colors">
                <div className={`p-3 rounded-full mr-4 shrink-0 ${ref.type === 'Mentor' ? 'bg-purple-500/20 text-purple-400' : ref.type === 'Book' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-blue-500/20 text-blue-400'}`}>
                  {ref.type === 'Mentor' && <User className="w-5 h-5" />}
                  {ref.type === 'Book' && <Book className="w-5 h-5" />}
                  {ref.type === 'Website' && <Globe className="w-5 h-5" />}
                </div>
                <div className="flex-1">
                  <h4 className="text-lg font-bold text-white">{ref.title}</h4>
                  <p className="text-slate-400 text-sm mb-1"><span className="font-semibold text-slate-300">Author/Source:</span> {ref.author}</p>
                  {ref.link && <a href={ref.link} target="_blank" rel="noopener noreferrer" className="text-cyan-400 text-xs hover:underline mt-2 inline-block">Visit Resource</a>}
                </div>
                <div className="hidden sm:block">
                  <span className="px-3 py-1 rounded-full text-xs font-medium bg-slate-700 text-slate-300 border border-slate-600">{ref.type}</span>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-20 text-center border-t border-slate-800 pt-8">
            <p className="text-slate-500 text-sm">© {new Date().getFullYear()} ISPC Team. All rights reserved.</p>
          </div>
        </div>
      );

      const App = () => {
        const [currentView, setCurrentView] = useState('home');
        const [isTransitioning, setIsTransitioning] = useState(false);

        const handleNavigate = (view) => {
          if (view === currentView) return;
          setIsTransitioning(true);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(() => {
            setCurrentView(view);
            setIsTransitioning(false);
          }, 300);
        };

        const renderView = () => {
          switch(currentView) {
            case 'home': return <Home onStart={() => handleNavigate('about')} />;
            case 'about': return <AboutUs />;
            case 'idea': return <ProductIdea />;
            case 'product': return <ProductShowcase />;
            case 'science': return <ScienceIntegration />;
            case 'bibliography': return <Bibliography />;
            default: return <Home onStart={() => handleNavigate('about')} />;
          }
        };

        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 font-sans selection:bg-cyan-500/30">
            <Navbar currentView={currentView} onNavigate={handleNavigate} />
            <main className={`transition-opacity duration-300 ${isTransitioning ? 'opacity-0' : 'opacity-100'}`}>
              {renderView()}
            </main>
            <div className="fixed top-0 left-0 w-full h-full pointer-events-none z-[-1] overflow-hidden">
              <div className="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-cyan-900/10 blur-[100px]"></div>
              <div className="absolute top-[40%] -right-[10%] w-[40%] h-[40%] rounded-full bg-purple-900/10 blur-[100px]"></div>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
